<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Marks Calculator</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#1f2937}
.container{max-width:1100px;margin:auto;padding:18px}
h1{margin:0 0 6px;color:#123c69}
.subtitle{margin:0 0 18px;color:#667085}
.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 3px 14px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
label{font-weight:600;font-size:14px}
input{width:100%;padding:11px;margin-top:5px;border:1px solid #ccd3dd;border-radius:8px;font-size:15px}
button{border:0;border-radius:8px;padding:10px 14px;margin:5px;cursor:pointer;font-weight:700}
.primary{background:#1769aa;color:#fff}.success{background:#168a4a;color:#fff}.danger{background:#c62828;color:#fff}
.secondary{background:#e8eef5;color:#123c69}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.status{padding:10px;border-radius:8px;background:#eef6ff;margin-bottom:12px}
.pass{color:#14833b;font-weight:700}.fail{color:#c62828;font-weight:700}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{border:1px solid #dce2e8;padding:9px;text-align:center}
th{background:#edf3f8}
.search{margin-bottom:10px}
.small{font-size:13px;color:#667085}
.result-box{padding:12px;background:#f7fafc;border-radius:8px;margin-top:12px}
.compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.student-card{border:1px solid #dce2e8;border-radius:10px;padding:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.container{padding:10px}}
</style>
</head>
<body>
<div class="container">
  <h1>Student Marks Calculator</h1>
  <p class="subtitle">Online student records — Save, Edit, Delete, Search & Compare</p>

  <div class="card">
    <div id="status" class="status">Connecting to database...</div>
    <h2 id="formTitle">Add Student</h2>
    <input type="hidden" id="editId">

    <div class="grid">
      <div><label>Student Name</label><input id="name" type="text" placeholder="Enter student name"></div>
      <div><label>Roll Number</label><input id="rollNo" type="text" placeholder="Enter roll number"></div>
      <div><label>Applied Chemistry (10)</label><input id="chemistry" type="number" min="0" max="10"></div>
      <div><label>Applied Mathematics (10)</label><input id="mathematics" type="number" min="0" max="10"></div>
      <div><label>Programming Language (10)</label><input id="programming" type="number" min="0" max="10"></div>
      <div><label>Environment & Sustainability (10)</label><input id="environment" type="number" min="0" max="10"></div>
      <div><label>Mechanical Engineering (10)</label><input id="mechanical" type="number" min="0" max="10"></div>
      <div><label>Electronics Engineering (20)</label><input id="electronics" type="number" min="0" max="20"></div>
      <div><label>Professional Communication & Technical Writing (10)</label><input id="pctw" type="number" min="0" max="10"></div>
    </div>

    <div class="actions">
      <button class="primary" id="saveBtn">Save Student</button>
      <button class="secondary" id="cancelBtn" style="display:none">Cancel Edit</button>
      <button class="secondary" id="clearBtn">Clear</button>
    </div>
    <div id="preview" class="result-box"></div>
  </div>

  <div class="card">
    <h2>Student Records</h2>
    <input class="search" id="search" type="text" placeholder="Search by name or roll number...">
    <p class="small">Select students and press Compare. Up to 1000 records are supported by this page.</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Compare</th><th>Name</th><th>Roll No.</th><th>Total</th><th>Percentage</th><th>Overall</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentTable"></tbody>
      </table>
    </div>
    <div class="actions">
      <button class="primary" id="compareBtn">Compare Selected</button>
      <button class="secondary" id="clearSelectionBtn">Clear Selection</button>
    </div>
  </div>

  <div class="card" id="compareSection" style="display:none">
    <h2>Comparison</h2>
    <div id="compareOutput"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc,
  onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCPpsZ66OK5ihbA0uJiE4Wd0TXBDOTc2Bo",
  authDomain: "student-marks-calculator-3cbab.firebaseapp.com",
  projectId: "student-marks-calculator-3cbab",
  storageBucket: "student-marks-calculator-3cbab.firebasestorage.app",
  messagingSenderId: "342725424710",
  appId: "1:342725424710:web:4042ae711f6e93112efc47",
  measurementId: "G-92C5JRVYSC"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const statusEl = document.getElementById("status");
const table = document.getElementById("studentTable");
const search = document.getElementById("search");
const editId = document.getElementById("editId");
const formTitle = document.getElementById("formTitle");
const saveBtn = document.getElementById("saveBtn");
const cancelBtn = document.getElementById("cancelBtn");
const preview = document.getElementById("preview");

let students = [];

const subjects = [
  ["chemistry","Applied Chemistry",10],
  ["mathematics","Applied Mathematics",10],
  ["programming","Programming Language",10],
  ["environment","Environment & Sustainability",10],
  ["mechanical","Mechanical Engineering",10],
  ["electronics","Electronics Engineering",20],
  ["pctw","Professional Communication & Technical Writing",10]
];

function val(id){ return Number(document.getElementById(id).value); }

function calculate(){
  const marks = {};
  let total=0, max=0, allPass=true;
  for(const [id,name,limit] of subjects){
    const m=val(id);
    marks[id]=m;
    total += m;
    max += limit;
    const passMark = limit * 0.40;
    if(m < passMark) allPass=false;
  }
  return {marks,total,max,percentage:(total/max)*100,overall:allPass ? "PASS" : "FAIL"};
}

function updatePreview(){
  const r=calculate();
  let html=`<b>Total:</b> ${r.total}/${r.max} &nbsp; | &nbsp; <b>Percentage:</b> ${r.percentage.toFixed(2)}% &nbsp; | &nbsp; <b>Overall:</b> <span class="${r.overall==="PASS"?"pass":"fail"}">${r.overall}</span><br><br>`;
  for(const [id,name,limit] of subjects){
    const passMark=limit*.4, m=r.marks[id];
    html += `${name}: ${m}/${limit} — <span class="${m>=passMark?"pass":"fail"}">${m>=passMark?"PASS":"FAIL"}</span> (pass: ${passMark})<br>`;
  }
  preview.innerHTML=html;
}
document.querySelectorAll("input[type=number]").forEach(x=>x.addEventListener("input",updatePreview));

function getFormData(){
  const name=document.getElementById("name").value.trim();
  const rollNo=document.getElementById("rollNo").value.trim();
  if(!name || !rollNo){ alert("Please enter student name and roll number."); return null; }
  const r=calculate();
  for(const [id,sub,limit] of subjects){
    if(r.marks[id] < 0 || r.marks[id] > limit || !Number.isFinite(r.marks[id])){
      alert(`${sub} marks must be between 0 and ${limit}.`); return null;
    }
  }
  return {name,rollNo,marks:r.marks,total:r.total,max:r.max,percentage:Number(r.percentage.toFixed(2)),overall:r.overall};
}

async function saveStudent(){
  const data=getFormData();
  if(!data) return;
  saveBtn.disabled=true;
  try{
    if(editId.value){
      await updateDoc(doc(db,"students",editId.value), {...data,updatedAt:serverTimestamp()});
      statusEl.textContent="Student updated successfully.";
    }else{
      if(students.length>=1000){ alert("1000 student limit reached."); return; }
      await addDoc(collection(db,"students"), {...data,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
      statusEl.textContent="Student saved successfully.";
    }
    resetForm();
  }catch(e){
    console.error(e);
    alert("Could not save/update. Check Firebase Authentication and Firestore rules.");
  }finally{saveBtn.disabled=false;}
}

function resetForm(){
  editId.value="";
  formTitle.textContent="Add Student";
  saveBtn.textContent="Save Student";
  cancelBtn.style.display="none";
  document.querySelectorAll("input[type=text],input[type=number]").forEach(i=>i.value="");
  updatePreview();
}

function editStudent(id){
  const s=students.find(x=>x.id===id);
  if(!s)return;
  editId.value=id;
  formTitle.textContent="Edit Student";
  saveBtn.textContent="Update Student";
  cancelBtn.style.display="inline-block";
  document.getElementById("name").value=s.name||"";
  document.getElementById("rollNo").value=s.rollNo||"";
  for(const [key] of subjects) document.getElementById(key).value=s.marks?.[key] ?? 0;
  updatePreview();
  window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteStudent(id){
  const s=students.find(x=>x.id===id);
  if(!s)return;
  if(!confirm(`Delete ${s.name} (${s.rollNo})?`))return;
  try{
    await deleteDoc(doc(db,"students",id));
    statusEl.textContent="Student deleted.";
  }catch(e){console.error(e);alert("Delete failed.");}
}

function render(){
  const q=search.value.trim().toLowerCase();
  const filtered=students.filter(s=>
    (s.name||"").toLowerCase().includes(q) || (s.rollNo||"").toLowerCase().includes(q)
  );
  table.innerHTML="";
  if(!filtered.length){
    table.innerHTML='<tr><td colspan="7">No student records found.</td></tr>';
    return;
  }
  filtered.forEach(s=>{
    const tr=document.createElement("tr");
    const overallClass=s.overall==="PASS"?"pass":"fail";
    tr.innerHTML=`
      <td><input type="checkbox" class="compareCheck" value="${s.id}"></td>
      <td>${escapeHtml(s.name)}</td>
      <td>${escapeHtml(s.rollNo)}</td>
      <td>${s.total}/${s.max}</td>
      <td>${Number(s.percentage).toFixed(2)}%</td>
      <td class="${overallClass}">${s.overall}</td>
      <td>
        <button class="secondary editBtn">Edit</button>
        <button class="danger deleteBtn">Delete</button>
        <button class="secondary detailsBtn">Details</button>
      </td>`;
    tr.querySelector(".editBtn").onclick=()=>editStudent(s.id);
    tr.querySelector(".deleteBtn").onclick=()=>deleteStudent(s.id);
    tr.querySelector(".detailsBtn").onclick=()=>showDetails(s);
    table.appendChild(tr);
  });
}

function escapeHtml(v){
  return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function showDetails(s){
  let html=`<h3>${escapeHtml(s.name)} — ${escapeHtml(s.rollNo)}</h3>`;
  html+=`<p><b>Total:</b> ${s.total}/${s.max} | <b>Percentage:</b> ${Number(s.percentage).toFixed(2)}% | <b>Overall:</b> <span class="${s.overall==="PASS"?"pass":"fail"}">${s.overall}</span></p>`;
  html+="<table><tr><th>Subject</th><th>Marks</th><th>Result</th></tr>";
  for(const [id,name,limit] of subjects){
    const m=Number(s.marks?.[id]??0), passMark=limit*.4;
    html+=`<tr><td>${name}</td><td>${m}/${limit}</td><td class="${m>=passMark?"pass":"fail"}">${m>=passMark?"PASS":"FAIL"}</td></tr>`;
  }
  html+="</table>";
  preview.innerHTML=html;
  window.scrollTo({top:0,behavior:"smooth"});
}

function compareSelected(){
  const ids=[...document.querySelectorAll(".compareCheck:checked")].map(x=>x.value);
  if(ids.length<2){alert("Select at least 2 students to compare.");return;}
  const selected=students.filter(s=>ids.includes(s.id));
  const section=document.getElementById("compareSection");
  section.style.display="block";
  let html='<div class="table-wrap"><table><tr><th>Subject</th>';
  selected.forEach(s=>html+=`<th>${escapeHtml(s.name)}<br>${escapeHtml(s.rollNo)}</th>`);
  html+="</tr>";
  for(const [id,name,limit] of subjects){
    html+=`<tr><td>${name} (${limit})</td>`;
    selected.forEach(s=>{
      const m=Number(s.marks?.[id]??0), pass=m>=limit*.4;
      html+=`<td class="${pass?"pass":"fail"}">${m}/${limit}<br>${pass?"PASS":"FAIL"}</td>`;
    });
    html+="</tr>";
  }
  html+='<tr><th>Total</th>';
  selected.forEach(s=>html+=`<th>${s.total}/${s.max}<br>${Number(s.percentage).toFixed(2)}%</th>`);
  html+='</tr><tr><th>Overall</th>';
  selected.forEach(s=>html+=`<th class="${s.overall==="PASS"?"pass":"fail"}">${s.overall}</th>`);
  html+='</tr></table></div>';
  document.getElementById("compareOutput").innerHTML=html;
  section.scrollIntoView({behavior:"smooth"});
}

function clearSelection(){
  document.querySelectorAll(".compareCheck").forEach(x=>x.checked=false);
}

saveBtn.onclick=saveStudent;
cancelBtn.onclick=resetForm;
document.getElementById("clearBtn").onclick=resetForm;
document.getElementById("compareBtn").onclick=compareSelected;
document.getElementById("clearSelectionBtn").onclick=clearSelection;
search.addEventListener("input",render);

async function start(){
  try{
    statusEl.textContent="Signing in...";
    await signInAnonymously(auth);
    statusEl.textContent="Connected. Student data will sync across devices.";
    onSnapshot(collection(db,"students"), snap=>{
      students=snap.docs.map(d=>({id:d.id,...d.data()}));
      students.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
      render();
      statusEl.textContent=`Connected — ${students.length} student record(s)`;
    }, err=>{
      console.error(err);
      statusEl.textContent="Database read error. Check Firestore rules.";
    });
  }catch(e){
    console.error(e);
    statusEl.textContent="Firebase connection/authentication failed.";
    alert("Enable Anonymous sign-in in Firebase Authentication, then reload the website.");
  }
}
start();
updatePreview();
</script>
</body>
</html>
