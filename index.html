<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Marks Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Marks Calculator</h1>

    <label>Enter your name</label>
    <input type="text" id="name">

    <label>Mathematics</label>
    <input type="number" id="mathematics">

    <label>Chemistry</label>
    <input type="number" id="chemistry">

    <label>Programming Language</label>
    <input type="number" id="programming_language">

    <label>Electronics</label>
    <input type="number" id="electronics">

    <label>Mechanical</label>
    <input type="number" id="mechanical">

    <label>Environment</label>
    <input type="number" id="environment">

    <label>PCTW</label>
    <input type="number" id="PCTW">

    <button onclick="calculateMarks()">Calculate Total</button>

    <div id="result"></div>

</div>


<script>

function calculateMarks() {

    let name = document.getElementById("name").value;

    let mathematics =
        Number(document.getElementById("mathematics").value);

    let chemistry =
        Number(document.getElementById("chemistry").value);

    let programming_language =
        Number(document.getElementById("programming_language").value);

    let electronics =
        Number(document.getElementById("electronics").value);

    let mechanical =
        Number(document.getElementById("mechanical").value);

    let environment =
        Number(document.getElementById("environment").value);

    let PCTW =
        Number(document.getElementById("PCTW").value);


    let sum = mathematics +
              chemistry +
              electronics +
              mechanical +
              programming_language +
              environment +
              PCTW;


    document.getElementById("result").innerHTML =
        "<h3>Result</h3>" +
        "Name: " + name + "<br>" +
        "Total Marks Obtained: " + sum + "<br>" +
        "Total Marks: 560";

}

</script>

</body>
</html>
